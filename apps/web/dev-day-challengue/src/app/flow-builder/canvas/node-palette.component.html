<section class="palette">
  <header>
    <h2>Biblioteca de nodos</h2>
    <p>Arrastra un nodo al canvas para crear un agente.</p>
  </header>

  <div class="palette-list">
    @for (item of palette; track item.type) {
      <button
        class="palette-item"
        draggable="true"
        (dragstart)="onDragStart($event, item.type)"
      >
        <span class="palette-title">{{ item.label }}</span>
        <span class="palette-description">{{ item.description }}</span>
        <span class="palette-chip">{{ item.type }}</span>
      </button>
    }
  </div>
</section>
