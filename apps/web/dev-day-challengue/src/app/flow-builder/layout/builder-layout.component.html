<section class="builder-shell">
  <header class="builder-header">
    <ng-content select="[slot=toolbar]"></ng-content>
  </header>

  <aside class="builder-panel builder-panel-left">
    <ng-content select="[slot=palette]"></ng-content>
  </aside>

  <main class="builder-canvas">
    <ng-content select="[slot=canvas]"></ng-content>
  </main>

  <aside class="builder-panel builder-panel-right">
    <ng-content select="[slot=inspector]"></ng-content>
  </aside>

  <section class="builder-chat">
    <ng-content select="[slot=chat]"></ng-content>
  </section>
</section>
